[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"
  # Сайт для людей отдаёт GitHub Pages. Netlify нужен только для функций (оплата, вход и т.д.).
  # Пересобираем Netlify только если менялись функции или зависимости — иначе сборка отменяется и кредиты не тратятся.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- netlify/ netlify.toml package.json package-lock.json"

[dev]
  command = "npm run dev"

[functions."check_subscriptions"]
  schedule = "@daily"
